name: Update data & deploy to GitHub Pages
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub may delay scheduled runs)
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Filing lookups (EDGAR, Metaplanet disclosures) are best-effort. A rejection
      # is recorded on the page and must not fail this deploy.
      - run: node scripts/update.mjs
      # Pages caches every file for 10 minutes. A new index.html must not keep
      # pointing at the previous app.js or style.css URL.
      - run: node scripts/stamp-assets.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
