# Temporary live check from a clean runner. Not part of the Pages deploy.
name: SEC live check
on:
  push:
    branches: [cursor/sec-filing-status-8ca1]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-data
          path: site/data.json
